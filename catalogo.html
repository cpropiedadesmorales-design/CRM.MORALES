header h1{font-size:clamp(26px,5vw,40px);letter-spacing:.06em}
header p{color:var(--muted);margin-top:8px;letter-spacing:.14em;text-transform:uppercase;font-size:12px}
main{max-width:1180px;margin:0 auto;padding:0 18px 80px}
.bar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:28px}
.seg{display:inline-flex;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:13px;padding:4px}
.seg button{padding:9px 20px;border-radius:9px;color:var(--muted);font-weight:500;transition:all .25s var(--ease)}
.seg button.active{background:var(--wine);color:var(--ivory)}
select{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:13px;padding:12px 14px;outline:0}
select option{background:var(--bg2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px}
.card{position:relative;display:grid;grid-template-rows:auto 1fr;background:linear-gradient(160deg,#341212,var(--bg2));border:1px solid var(--line);border-radius:20px;overflow:hidden;cursor:pointer;transition:transform .3s var(--ease),border-color .3s,box-shadow .3s;animation:rise .6s var(--ease) backwards}
.card:hover{transform:translateY(-5px);border-color:var(--wine-hi);box-shadow:0 22px 50px rgba(0,0,0,.5)}
.cover{aspect-ratio:16/11;background:linear-gradient(135deg,var(--wine),var(--bg2)) center/cover;transition:transform .6s var(--ease)}
.card:hover .cover{transform:scale(1.04)}
.cw{overflow:hidden}
.pb{padding:16px 18px 18px;display:grid;gap:7px;align-content:start}
.tag{justify-self:start;font-size:11px;padding:2px 10px;border-radius:20px;background:rgba(158,51,51,.28);border:1px solid rgba(158,51,51,.5)}
.card h3{font-size:17px;line-height:1.25}
.price{font:600 22px var(--fh)}
.specs{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.sk{background:linear-gradient(90deg,rgba(245,235,230,.05),rgba(245,235,230,.13),rgba(245,235,230,.05));background-size:220% 100%;animation:sh 1.3s linear infinite;border-radius:18px;height:330px}
@keyframes sh{to{background-position:-220% 0}}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 20px;border:1px dashed var(--line);border-radius:20px}
.overlay{position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:5vh 14px;overflow-y:auto;background:rgba(22,7,7,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);opacity:0;visibility:hidden;transition:opacity .3s var(--ease),visibility .3s}
.overlay.open{opacity:1;visibility:visible}
.sheet{width:min(820px,100%);background:linear-gradient(170deg,#321010,var(--bg2));border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 40px 100px rgba(0,0,0,.6);transform:translateY(18px) scale(.98);transition:transform .4s var(--ease)}
.overlay.open .sheet{transform:none}
.head{display:flex;justify-content:space-between;gap:12px;margin-bottom:14px}
.head h2{font-size:26px;line-height:1.15}
.x{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;transition:background .2s}.x:hover{background:rgba(158,51,51,.25)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:16px 0}
.gal img,.gal .sk{width:100%;height:100px;object-fit:cover;border-radius:12px;cursor:zoom-in;transition:transform .2s,filter .2s}
.gal img:hover{transform:scale(1.05);filter:brightness(1.15)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:13px;font-weight:600;color:var(--ivory);text-decoration:none;background:linear-gradient(135deg,var(--wine),var(--wine-hi));box-shadow:0 8px 22px rgba(100,32,32,.4);transition:transform .22s var(--ease),filter .22s}
.btn:hover{transform:scale(1.04);filter:brightness(1.14)}
.btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none}
.foot{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
#lb{position:fixed;top:0;right:0;bottom:0;left:0;z-index:80;display:grid;place-items:center;background:rgba(10,3,3,.9);backdrop-filter:blur(10px);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;cursor:zoom-out}
#lb.open{opacity:1;visibility:visible}#lb img{max-width:94vw;max-height:90vh;border-radius:14px}
footer{text-align:center;color:var(--faint);font-size:12px;padding:0 20px 40px}
#top{position:fixed;right:20px;bottom:20px;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--wine),var(--wine-hi));box-shadow:0 10px 28px rgba(0,0,0,.5);opacity:0;visibility:hidden;transform:translateY(14px);transition:all .4s var(--ease)}
#top.show{opacity:1;visibility:visible;transform:none}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
  <span class="mark" role="img" aria-label="Morales &amp; Co."></span>
  <h1>MORALES &amp; CO.</h1>
  <p>Propiedades</p>
</header>
<main>
  <div class="bar">
    <div class="seg" id="seg"><button data-op="" class="active">Todas</button><button data-op="Renta">Renta</button><button data-op="Venta">Venta</button></div>
    <select id="tipo" aria-label="Tipo"><option value="">Todos los tipos</option><option>Casa</option><option>Departamento</option><option>Terreno</option><option>Local</option></select>
    <select id="orden" aria-label="Orden"><option value="new">Más recientes</option><option value="asc">Precio: menor a mayor</option><option value="desc">Precio: mayor a menor</option></select>
  </div>
  <div class="grid" id="grid"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
</main>
<footer>© Morales &amp; Co. Propiedades · Información sujeta a disponibilidad</footer>
<div class="overlay" id="ov"><div class="sheet" id="sheet"></div></div>
<div id="lb"><img alt=""></div>
<button id="top" aria-label="Volver arriba"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>

<script type="module">
/* ► Escribe aquí tu WhatsApp con lada de país, solo números (ej. 522221234567). Si lo dejas vacío, el botón no se muestra. */
const CONTACT_WA = '';

const BASE = 'https://www.gstatic.com/firebasejs/12.19.0/';
const cfg = { apiKey: "AIzaSyCWMB-ataWwU_vbdh4W7HroPhHNrB7S60k", authDomain: "crm-morales.firebaseapp.com", projectId: "crm-morales", storageBucket: "crm-morales.firebasestorage.app", messagingSenderId: "539744918973", appId: "1:539744918973:web:cf2f3b568cad80726c06d4" };
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
/* Seguridad: solo se aceptan imágenes y números con el formato esperado (evita inyectar código desde la base de datos) */
const safeImg = u => (typeof u === 'string' && u.length < 600000 && /^data:image\/(?:jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(u)) ? u : '';
const num = v => { const n = +v; return isFinite(n) ? n : 0; };
const money = n => new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN', maximumFractionDigits: 0 }).format(+n || 0);
const grid = $('#grid');
let A, F;
try { [A, F] = await Promise.all([import(BASE + 'firebase-app.js'), import(BASE + 'firebase-firestore.js')]); }
catch (e) { grid.innerHTML = '<div class="empty">No se pudo cargar el catálogo. Revisa tu conexión e intenta de nuevo.</div>'; throw e; }
/* Nombre de tu base de datos en Firestore (la tuya se llama "morales") */
const DB_ID = (() => { try { const q = new URLSearchParams(location.search).get('db'); return q || 'morales'; } catch (e) { return 'morales'; } })();
const db = F.getFirestore(A.initializeApp(cfg), DB_ID);
let list = [], op = '', tipo = '', orden = 'new';
const specs = p => [num(p.recamaras) ? `${num(p.recamaras)} rec.` : '', num(p.banos) ? `${num(p.banos)} ${num(p.banos) === 1 ? 'baño' : 'baños'}` : '', p.m2 ? esc(p.m2) + (/m/i.test(p.m2) ? '' : ' m²') : ''].filter(Boolean).map(x => `<span>${x}</span>`).join('');
const price = p => money(p.precio) + (p.operacion === 'Renta' ? ' /mes' : '');
const mapHref = u => /^https?:/i.test(u) ? u : 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(u);

function render() {
  let l = list.filter(p => (!op || p.operacion === op) && (!tipo || p.tipo === tipo));
  l = l.sort((a, b) => orden === 'asc' ? a.precio - b.precio : orden === 'desc' ? b.precio - a.precio : (b.creado || 0) - (a.creado || 0));
  grid.innerHTML = l.length ? l.map((p, i) => `<article class="card" data-id="${p.id}" style="animation-delay:${Math.min(i, 8) * 60}ms"><div class="cw"><div class="cover" style="${safeImg(p.portada) ? `background-image:url(${safeImg(p.portada)})` : ''}"></div></div><div class="pb"><span class="tag">${esc(p.tipo)} · ${esc(p.operacion)}</span><h3>${esc(p.nombre)}</h3><div class="price">${price(p)}</div><div class="specs">${specs(p)}</div></div></article>`).join('') : '<div class="empty">No hay propiedades disponibles con ese filtro por ahora.</div>';
}
async function open(id) {
  const p = list.find(x => x.id === id); if (!p) return;
  const msg = encodeURIComponent(`Hola, me interesa: ${p.nombre} (${price(p)}). ¿Sigue disponible?`);
  $('#sheet').innerHTML = `<div class="head"><div><h2>${esc(p.nombre)}</h2><div class="price" style="margin-top:6px">${price(p)}</div></div><button class="x" data-x aria-label="Cerrar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <span class="tag">${esc(p.tipo)} · ${esc(p.operacion)}</span><div class="specs" style="margin-top:12px">${specs(p)}</div>
    <div class="gal" id="gal"><div class="sk" style="height:100px"></div><div class="sk" style="height:100px"></div><div class="sk" style="height:100px"></div></div>
    <p style="color:var(--muted);white-space:pre-line">${esc(p.descripcion || '')}</p>
    <div class="foot">${CONTACT_WA ? `<a class="btn" target="_blank" rel="noopener" href="https://wa.me/${CONTACT_WA}?text=${msg}">Me interesa · WhatsApp</a>` : ''}${p.ubicacion ? `<a class="btn ghost" target="_blank" rel="noopener" href="${esc(mapHref(p.ubicacion))}">Ver ubicación</a>` : ''}</div>`;
  $('#ov').classList.add('open'); document.body.style.overflow = 'hidden';
  try {
    const snap = await F.getDocs(F.query(F.collection(db, 'propiedades', id, 'fotos'), F.orderBy('orden')));
    const g = $('#gal'); if (!g) return;
    const fotos = snap.docs.map(d => safeImg(d.data().data)).filter(Boolean);
    g.innerHTML = fotos.length ? fotos.map(s => `<img src="${s}" alt="" loading="lazy">`).join('') : '';
  } catch (e) { const g = $('#gal'); if (g) g.innerHTML = ''; }
}
const close = () => { $('#ov').classList.remove('open'); document.body.style.overflow = ''; };
grid.addEventListener('click', e => { const c = e.target.closest('.card'); if (c) open(c.dataset.id); });
$('#ov').addEventListener('mousedown', e => { if (e.target.id === 'ov' || e.target.closest('[data-x]')) close(); });
$('#sheet').addEventListener('click', e => { if (e.target.closest('[data-x]')) close(); const i = e.target.closest('.gal img'); if (i) { $('#lb img').src = i.src; $('#lb').classList.add('open'); } });
$('#lb').addEventListener('click', () => $('#lb').classList.remove('open'));
addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('#lb').classList.contains('open')) $('#lb').classList.remove('open'); else close(); } });
$('#seg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; document.querySelectorAll('#seg button').forEach(x => x.classList.toggle('active', x === b)); op = b.dataset.op; render(); });
$('#tipo').addEventListener('change', e => { tipo = e.target.value; render(); });
$('#orden').addEventListener('change', e => { orden = e.target.value; render(); });
const top = $('#top'); addEventListener('scroll', () => top.classList.toggle('show', scrollY > 500), { passive: true });
top.addEventListener('click', () => scrollTo({ top: 0, behavior: 'smooth' }));

F.onSnapshot(F.query(F.collection(db, 'propiedades'), F.where('estatus', '==', 'Disponible')), snap => {
  list = snap.docs.map(d => ({ id: d.id, ...d.data() })); render();
}, err => { console.error(err); grid.innerHTML = '<div class="empty">El catálogo no está disponible por el momento. Intenta más tarde.</div>'; });
</script>
</body>
</html>
